name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from `packageManager` in package.json — specifying it here
        # too makes action-setup fail with a version mismatch.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Skips cleanly until the Neon credentials are configured (repo variable
    # NEON_PROJECT_ID + secret NEON_API_KEY), so the PR isn't red before setup.
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from `packageManager` in package.json — specifying it here
        # too makes action-setup fail with a version mismatch.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ephemeral Neon branch per run — a disposable copy of the project's primary
      # branch (already migrated). The e2e seed truncates jobs/resumes on THIS
      # branch only. Requires repo secret NEON_API_KEY + variable NEON_PROJECT_ID.
      - name: Create Neon branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-e2e-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Point the app + seed at the branch
        run: |
          # Mask the connection string (it carries a password) so it never
          # appears in plaintext in the run log.
          echo "::add-mask::${{ steps.create-branch.outputs.db_url }}"
          echo "DATABASE_URL=${{ steps.create-branch.outputs.db_url }}" >> "$GITHUB_ENV"
          echo "E2E_DATABASE_URL=${{ steps.create-branch.outputs.db_url }}" >> "$GITHUB_ENV"

      - name: Migrate schema (no-op if the branch already has it)
        run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Delete Neon branch
        if: ${{ always() }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.create-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
